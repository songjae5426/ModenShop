<!-- header.html -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<header th:fragment="defaultHeader"
	class="bg-light border-bottom shadow-sm py-3">
	<div class="container">
		<div class="row align-items-center">

			<div class="col-md-4 mb-2 mb-md-0">
				<div class="input-group">
					<input class="form-control" type="text" placeholder="상품 검색">
					<div class="input-group-append">
						<button class="btn btn-outline-secondary" type="button">검색</button>
					</div>
				</div>
			</div>

			<div class="col-md-4 text-center">
				<a href="/moden-shop/home" class="text-dark text-decoration-none">
					<h1 class="h3 font-weight-bold mb-0">ModenShop</h1> <small
					class="text-muted">모던 의류 전문</small>
				</a>
			</div>

			<div class="col-md-4">
				<ul class="nav justify-content-end">
					<th:block th:switch="${memberType}">
						<!-- 일반 회원 -->
						<th:block th:case="'general'">
							<li class="nav-item"><a id="myPageBtn"
								class="nav-link text-dark" href="#">마이페이지</a></li>
							<li class="nav-item"><a class="nav-link text-dark"
								href="/moden-shop/logout">로그아웃</a></li>
							<li class="nav-item"><a class="nav-link text-dark" href="/moden-shop/cart">장바구니</a>
							</li>
						</th:block>

						<!-- 관리자 -->
						<th:block th:case="'manager'">
							<li class="nav-item"><a id="managerPageBtn"
								class="nav-link text-dark" href="#">관리자페이지</a></li>
							<li class="nav-item"><a class="nav-link text-dark"
								href="/moden-shop/logout">로그아웃</a></li>
							<li class="nav-item"><a class="nav-link text-dark" href="#">장바구니</a>
							</li>
						</th:block>

						<!-- 비로그인 -->
						<th:block th:case="*">
							<li class="nav-item"><a class="nav-link text-dark"
								href="/moden-shop/login">로그인</a></li>
							<li class="nav-item"><a class="nav-link text-dark"
								href="/moden-shop/join">회원가입</a></li>
						</th:block>
					</th:block>
					<li class="nav-item"><a class="nav-link text-dark" href="#">고객센터</a>
					</li>
				</ul>
			</div>

		</div>
	</div>
</header>

<header th:fragment="loginAndJoinHeader"
	class="bg-light border-bottom shadow-sm py-4 text-center">
	<a href="/moden-shop/home" class="text-dark text-decoration-none">
		<h1 class="display-4 font-weight-bold mb-0">ModenShop</h1>
	</a>
</header>

<script th:fragment="headerScript">
	$("#managerPageBtn")
			.on(
					"click",
					function() {
						let width = window.screen.availWidth;
						let height = window.screen.availHeight;
						let url = "/moden-shop/manager-page";
						let title = "manager-page";
						let status = `width=${width},height=${height},resizable=no,scrollbars=no`;
						window.open(url, title, status);
					});
</script>
