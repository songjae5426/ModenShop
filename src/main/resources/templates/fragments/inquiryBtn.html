<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<div id="inquiryBtn" th:fragment="inquiryIcon" class="hover inquiry-icon-box align-items-center justify-content-center d-flex rounded-circle bg-info">
		<img alt="문의아이콘" src="/icon/inquiryIcon.png" width="50px" height="50px">
	</div>
	
	<script th:fragment="inquiryBtnScript">
		$("#inquiryBtn").on("click", function(){
			let url = "/inquiry";	// 띄울 url
			let title = "inquiry"; // 띄운 창을 구별하는 이름 (브라우저의 표시되는 title => X)
			// top => 창의 위쪽 위치를 화면 위에서부터 얼마나 거리에 둘건지, left도 마찬가지, resizable=yes => 사용자가 창크기 조절가능
			let status = "width=500,height=600,top=200,left=200,resizable=no,scrollbars=no";
			window.open(url, title, status);		// 팝업 띄우기
			
		});
	</script>
</html>
