		function formatPhoneNumber(num) {
		  num = num.replace(/[^0-9]/g, ''); // 숫자만 남기기
		
		  if (num.startsWith('02')) {
		    return num.replace(/(\d{2})(\d{3,4})(\d{4})/, '$1-$2-$3');
		  } else if (num.length === 10) {
		    return num.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
		  } else if (num.length === 11) {
		    return num.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
		  } else {
		    return num; 
		  }
		}
		function daumAddressService() {
			new daum.Postcode(
				{
					oncomplete : function(data) {
						// 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

						// 각 주소의 노출 규칙에 따라 주소를 조합한다.
						// 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
						let addr = ''; // 주소 변수
						let extraAddr = ''; // 참고항목 변수

						//사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
						if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
							addr = data.roadAddress;
						} else { // 사용자가 지번 주소를 선택했을 경우(J)
							addr = data.jibunAddress;
						}

						// 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
						if (data.userSelectedType === 'R') {
							// 법정동명이 있을 경우 추가한다. (법정리는 제외)
							// 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
							if (data.bname !== ''
									&& /[동|로|가]$/g.test(data.bname)) {
								extraAddr += data.bname;
							}
							// 건물명이 있고, 공동주택일 경우 추가한다.
							if (data.buildingName !== ''
									&& data.apartment === 'Y') {
								extraAddr += (extraAddr !== '' ? ', '
										+ data.buildingName
										: data.buildingName);
							}
							// 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
							if (extraAddr !== '') {
								extraAddr = ' (' + extraAddr + ')';
							}
							// 조합된 참고항목을 해당 필드에 넣는다.
							extraAddr = $.trim(extraAddr); // 공백 제거
							$("#extraAddress").val(extraAddr);

						} else {
							$("#extraAddress").val("");
						}

						// 우편번호와 주소 정보를 해당 필드에 넣는다.
						$("#postCode").val(data.zonecode);
						$("#address").val(addr);
						// 커서를 상세주소 필드로 이동한다.
						$("#detailAddress").focus();
					}
				}).open();
		}
		
		function summerNote(tagsStr, html){
			let imgSrcArrayTemp = [];
			$(tagsStr).summernote({
				  // 에디터 크기 설정
				  height: 'calc(100vh - 200px)',
				  minHeight: 'calc(100vh - 200px)',
				  maxHeight: 'calc(100vh - 200px)',
				  width: '100%',
				  // 에디터 한글 설정
				  lang: 'ko-KR',
				  // 에디터에 커서 이동 (input창의 autofocus라고 생각하시면 됩니다.)
				  toolbar: [
					    // 글자 크기 설정
					    ['fontsize', ['fontsize']],
					    // 글자 [굵게, 기울임, 밑줄, 취소 선, 지우기]
					    ['style', ['bold', 'italic', 'underline','strikethrough', 'clear']],
					    // 글자색 설정
					    ['color', ['color']],
					    // 표 만들기
					    ['table', ['table']],
					    // 서식 [글머리 기호, 번호매기기, 문단정렬]
					    ['para', ['ul', 'ol', 'paragraph']],
					    // 줄간격 설정
					    ['height', ['height']],
					    // 이미지 첨부
					    ['insert',['picture']]
					  ],
					  // 추가한 글꼴
					fontNames: ['Arial', 'Arial Black', 'Comic Sans MS', 'Courier New','맑은 고딕','궁서','굴림체','굴림','돋음체','바탕체'],
					 // 추가한 폰트사이즈
					fontSizes: ['8','9','10','11','12','14','16','18','20','22','24','28','30','36','50','72','96'],
			        // focus는 작성 페이지 접속시 에디터에 커서를 위치하도록 하려면 설정해주세요.
					focus : true,
			        // callbacks은 이미지 업로드 처리입니다.
					callbacks : { 
						onInit: function(){
							if(html != null){
								$(tagsStr).summernote("code", html);
							}
						},
						// 이 함수는 이미지가 삽입 될때마다 이벤트가 발생한다(기본적으로 이미지 파일일때만 반응 필터일 되어있음)
						onImageUpload : function(files) { 
			                // 다중 이미지 처리를 위해(한번에 여러 이미지를 선택해서 삽입할수있다)
							for (let i = 0; i < files.length; i++) {
								summerNoteImageUploader(files[i]);
							}
						}
						
					}
			  });
		}
		
		
		
		
		
		function summerNoteImageUploader(file) {
			let formData = new FormData();
			formData.append('imgFile', file);	// form데이터 객체에 이미지파일 추가
			$.ajax({  
				url : '/moden-shop/manager/summer-note/img/temp/upload/session/check',
				type : "post",
				data : formData,
				contentType : false,				// 서버로 넘기는 값의 contentType을 지정 => 기본적으로 ajax는 contentType이 true인데 true이면 무조건 application/x-www-form-urlencoded형식으로 contentType을 지정됨  => false이면 알아서 알맞은 contentType으로 지정해서 보내줌
				processData : false,				// 서버로 넘기는 데이터를 인코딩에서 설정한 타입으로 변환하는 속성 => 기본 값은 true => ajax는 기본적으로 data속성 값(서버로 넘기는 값)을 application/x-www-form-urlencoded 형식의 문자열로 변환함 그걸 막음
				enctype : 'multipart/form-data',  // 서버로 넘기는 데이터의 타입 지정
				success : function(response) { 
					//img 태그 생성
					let img = document.createElement("img");	
					img.src = response.url;	// 서버로 받은 url
					img.style.width = "100%";
					// 커서 위치에 이미지 태그 삽입
					$("#summernote").summernote("insertNode", img);
				},
				error: function(xhr){
					switch(xhr.status){
						case 401:
							settingAndShowAlarmModal("알람", "세션이 만료되었습니다. 다시 한번 로그인 부탁드립니다", null, null);
							$("#startContent").remove();
							$("#modalBox").after(createManagerPageLoginContent());
							loginEvent();
						break;
					}
				}
			});
		}
		
			
		
		// -------------------------------- 이벤트 + ajax -----------------------------
		
		
		
		let globalSummerNoteHtml = null;
		function productExplanationWriterEvent(
				productNameInput,
				productCategoryRadio,
				productRegularPriceInput,
				productSalesPriceInput,
				productDeliveryCostInput,
				sSizeCountInput,
				mSizeCountInput,
				lSizeCountInput,
				productMainImg){
			
			$("#summernoteBoxBackBtn").off("click").on("click", function(){
				let summerNoteContentHtml = $("#summernote").summernote("code");
				if(!(!summerNoteContentHtml || summerNoteContentHtml === "" || summerNoteContentHtml=== "<p><br></p>")){
					// addProductInfo에 있는 변수
					globalSummerNoteHtml = $("#summernote").summernote("code");
				}
				$("#content").html(createAddProductInfoContent());
				// 원래 값 유지하기 위해서
				$("#productNameInput").val(productNameInput);
				$(`input[name="productCategory"][value="${productCategoryRadio}"]`).prop("checked", true);
				$("#productRegularPriceInput").val(productRegularPriceInput);
				$("#productSalesPriceInput").val(productSalesPriceInput);
				$("#productDeliveryCostInput").val(productDeliveryCostInput);
				$("#sSizeCountInput").val(sSizeCountInput);
				$("#mSizeCountInput").val(mSizeCountInput);
				$("#lSizeCountInput").val(lSizeCountInput);
				$("#imgSelectedIcon").removeClass("d-none");
				addProductInfoEvnet();
			});
			$("#productUploda").off("click").on("click", function(){
				// html을 문자열로 가져옴
				let summerNoteContentHtml = $("#summernote").summernote("code");
				let formData = new FormData();
				formData.append("summerNoteContentHtml", summerNoteContentHtml);
				formData.append("productName", productNameInput);
				formData.append("productCategory", productCategoryRadio);
				formData.append("productRegularPrice", productRegularPriceInput);
				formData.append("productSalesPrice", productSalesPriceInput);
				formData.append("productDeliveryCost", productDeliveryCostInput);
				formData.append("sSizeCount", sSizeCountInput);
				formData.append("mSizeCount", mSizeCountInput);
				formData.append("lSizeCount", lSizeCountInput);
				formData.append("productMainImgFile", productMainImg);	// form데이터 객체에 이미지파일 추가
				
				// 썸머노트 내용이 없으면
				if(!summerNoteContentHtml || summerNoteContentHtml === "" || summerNoteContentHtml=== "<p><br></p>"){
					settingAndShowAlarmModal("알람", "상세설명을 입력해주세요", null, null);
					return;
				}
				$.ajax({
					url: "/moden-shop/manager/product/upload/session/check",
					type: "post",
					data: formData,
					enctype: "multipart/form-data",
					processData: false,
					contentType: false,
					success: function(response){
						if(response.success){
							settingAndShowAlarmModal("알람", "상품이 업로드가 완료 되었습니다", null, null);
							resetImgUploadModal();
							globalSummerNoteHtml = null;
							$("#content").html(createProductManagementContent());
							productManagementEvent(null);
						}else{
							settingAndShowAlarmModal("알람", "상품이 업로드에 문제가 발생하였습니다...", null, null);
						}
					},
					error: function(xhr){
						console.log("상품 업로드 ajax 에러 : " + xhr.status);
						switch(xhr.status){
							case 401:
								settingAndShowAlarmModal("알람", "세션이 만료되었습니다. 다시 한번 로그인 부탁드립니다", null, null);
								$("#startContent").remove();
								$("#modalBox").after(createManagerPageLoginContent());
								loginEvent();
							break;
						}
					}
				});
			});
			
		}
		
		
		
		
		
		
		function addProductInfoEvnet(){
			let productMainImgFile = null;
			// 상품정보 추가 이벤트가 시작 될때마다 이미지 모달에 선택된 이미지를 가져옴
			imgUploadModalEvenet(function(selectedImgFile){
				productMainImgFile = selectedImgFile;
			});
			
			$("#productMainImgUploadBtn").off("click").on("click", function(){
				settingImgUploadModalTitle("상품 썸네일 업로드");
				$("#imgUploadModal").modal("show");
				imgUploadModalEvenet(function(selectedImgFile){
					if(!(selectedImgFile === undefined)){
						$("#imgSelectedIcon").removeClass("d-none");
					}
					productMainImgFile = selectedImgFile;
				});
			});
			
			
			$("#productInfoNextBtn").off("click").on("click", function(){
				let productNameInput = $("#productNameInput").val();
				let productCategoryRadio = $('input[name="productCategory"]:checked').val();
				let productRegularPriceInput = Number($("#productRegularPriceInput").val());
				let productSalesPriceInput =  Number($("#productSalesPriceInput").val());
				let productDeliveryCostInput = $("#productDeliveryCostInput").val();
				let sSizeCountInput = $("#sSizeCountInput").val();
				let mSizeCountInput = $("#mSizeCountInput").val();
				let lSizeCountInput = $("#lSizeCountInput").val();
				let productMainImg = productMainImgFile;

				// 유효성 검사
				if(productNameInput == ""){
					settingAndShowAlarmModal("알람", "상품명을 입력해주세요", null, null);
					return;
				}
				if(productCategoryRadio == null){
					settingAndShowAlarmModal("알람", "상품 카테고리를 체크해주세요", null, null);
					return;
				}
				if(productRegularPriceInput == ""){
					settingAndShowAlarmModal("알람", "정가을 입력해주세요", null, null);
					return;
				}
				if(productSalesPriceInput == ""){
					settingAndShowAlarmModal("알람", "판매가를 입력해주세요", null, null);
					return;
				}
				if(productRegularPriceInput < productSalesPriceInput){
					settingAndShowAlarmModal("알람", "정가가 판매가보다 적습니다..", null, null);
					return;
				}
				if(productDeliveryCostInput == ""){
					settingAndShowAlarmModal("알람", "배달비를 입력해주세요", null, null);
					return;
				}
				if(sSizeCountInput == ""){
					settingAndShowAlarmModal("알람", "사이즈S수량을 입력해주세요", null, null);
					return;
				}
				if(mSizeCountInput == ""){
					settingAndShowAlarmModal("알람", "사이즈M수량을 입력해주세요", null, null);
					return;
				}
				if(lSizeCountInput == ""){
					settingAndShowAlarmModal("알람", "사이즈L수량을 입력해주세요", null, null);
					return;
				}
				if(productMainImg == null){
					settingAndShowAlarmModal("알람", "썸네일 사진을 선택해주세요", null, null);
					return;
				}
				$("#content").html(createProductExplanationWriterContent());
				
				if(globalSummerNoteHtml != null){
					summerNote("#summernote", globalSummerNoteHtml);
				}else{
					summerNote("#summernote", null);		// 썸머노트 함수
				}
				
				// 상세페이지 작성 이벤트
				productExplanationWriterEvent(
						productNameInput,
						productCategoryRadio,
						productRegularPriceInput,
						productSalesPriceInput,
						productDeliveryCostInput,
						sSizeCountInput,
						mSizeCountInput,
						lSizeCountInput,
						productMainImg);
			});
			
			$("#addProductInfoContentBackBtn").off("click").on("click", function(){
				$("#content").html(createProductManagementContent());
				productManagementEvent(null);
			});
			
		}
		
		// 상품 관리 화면 이벤트
		function productManagementEvent(productId){
			$("#searchBtn").off("click").on("click", function(){
				let searchText = $("#searchText").val();
				$.ajax({
					url: "/moden-shop/manager/product/search/session/check",
					type: "get",
					data: {"productName": searchText},
					success: function(response){
						$("#productManagementTbody").empty();
						if(response.serachResultEmpty){
							$("#notSearchText").removeClass("d-none");
							$("#productListTable").addClass("d-none");
							$("#notProductText").addClass("d-none");
						}else{
							$("#notSearchText").addClass("d-none");
							$("#productListTable").removeClass("d-none");
							$("#notProductText").addClass("d-none");
							for(let productManageListItemDto of response.productManageListItemDtoList){
								$("#productManagementTbody").append(createProductManagementTableRow(productManageListItemDto));
							}
						}
					},
					error: function(xhr){
						switch(xhr.status){
							case 401:
								settingAndShowAlarmModal("알람", "세션이 만료되었습니다. 다시 한번 로그인 부탁드립니다", null, null);
								$("#startContent").remove();
								$("#modalBox").after(createManagerPageLoginContent());
								loginEvent();
							break;
						}
					}
				});
			});
			
			// 상품 목록 받아오기
			$.ajax({
				url: "/moden-shop/manager/product/list/session/check",
				type: "get",
				success: function(response){
					if(!response.emptyList){
						let productManageListItemDtoList = response.productManageListItemDtoList
						for(let productManageListItemDto of productManageListItemDtoList){
							$("#productManagementTbody").append(createProductManagementTableRow(productManageListItemDto));
							$("#notProductText").addClass("d-none");
							$("#notSearchText").addClass("d-none");
							$("#productListTable").removeClass("d-none");
						}
					}else{
						$("#notProductText").removeClass("d-none");
						$("#productListTable").addClass("d-none");
						$("#notSearchText").addClass("d-none");
					}
				},
				error: function(xhr){
					console.log("product리스트 받아오기 ajax 에러 : " + xhr.status);
					switch(xhr.status){
						case 401:
							settingAndShowAlarmModal("알람", "세션이 만료되었습니다. 다시 한번 로그인 부탁드립니다", null, null);
							$("#startContent").remove();
							$("#modalBox").after(createManagerPageLoginContent());
							loginEvent();
						break;
					}
				}

		function imgUploadModalEvenet(callback){
			$("#imgUploadModalFileInput").off("change").on("change", function(event) {
				let file = event.target.files[0]; // 선택한 파일
				if (file) {
					// 가능한 확장자
					let allowedExtensions = ['jpg', 'jpeg', 'png', 'gif'];
					// 파일이름 가져오기(확장자 포함)
					let fileName = file.name;
					// .을 기준으로 문자열을 잘라 배열에 담고 pop()메소드로 마지막 인덱스 문자열을 가져옴 그다음 toLowerCase()로 소문자로 변경
					let fileExtension = fileName.split('.').pop().toLowerCase();
	
					// 가져온 파일의 확장자가 가능한 확장자 배열에 포함되어 있지 않으면
					if (!allowedExtensions.includes(fileExtension)) {
						settingAndShowAlarmModal("알람", "이미지 파일만 업로드 가능합니다 (jpg, jpeg, png, gif)", null, null);
						// 선택된 파일 초기화
						$(this).val("");
						$("#imgUploadModalImgPreview").addClass("d-none");
						$("#imgUploadModalPreviewText").removeClass("d-none");
						return;
					}
					// 미리보기 처리
					let reader = new FileReader();
					reader.onload = function(e) {
						$("#imgUploadModalImgPreview").attr("src", e.target.result);
						$("#imgUploadModalImgPreview").removeClass("d-none");
						$("#imgUploadModalPreviewText").addClass("d-none");
					};
					reader.readAsDataURL(file);
				}
			});
			$("#imgUploadModalCommitBtn").off("click").on("click", function(){
				let imgFile = $("#imgUploadModalFileInput")[0].files[0];
				callback(imgFile);
			});
			let imgUploadModalFileInput = $("#imgUploadModalFileInput")[0].files[0];
			// 이미지업로드 모달이벤트가 실행됬을떄 선택된 파일이있으면 콜백함수의 인자로 전달
			if(!(imgUploadModalFileInput === undefined)){
				let imgFile = $("#imgUploadModalFileInput")[0].files[0];
				callback(imgFile);
			}
		}

		function loginEvent(){
			// input 입력시 alarmText 초기화
			$("#loginEmailInput").off("keypress").on("keypress", function(){
				$("#emailAlarmText").addClass("d-none");
			});
			$("#loginPasswordInput").off("keypress").on("keypress", function(){
				$("#passwordAlarmText").addClass("d-none");
			});
			// 로그인 버튼
			$("#loginBtn").off("click").on("click", function(){
				let loginEmailInput = $("#loginEmailInput").val();
				let loginPasswordInput = $("#loginPasswordInput").val();
				if(loginEmailInput == ""){
					settingAndShowAlarmModal("알람", "이메일을 입력해주세요", null, null);
					return;
				}
				// 이메일 형식 정규식
				let emailPattern = /^[0-9a-zA-Z]([-_.]?[0-9a-zA-Z])*@[0-9a-zA-Z]([-_.]?[0-9a-zA-Z])*\.[a-zA-Z]{2,3}$/i;
				if(!emailPattern.test(loginEmailInput)){
					settingAndShowAlarmModal("알람", "올바른 이메일 형식으로 입력해 주세요", null, null);
					return;
				}
				if(loginPasswordInput == ""){
					settingAndShowAlarmModal("알람", "비밀번호를 입력해주세요", null, null);
					return;
				}
				$.ajax({
					url: "/moden-shop/manager/member/login",
					type: "post",
					contentType: "application/json",
					data: JSON.stringify({"email": loginEmailInput, "password": loginPasswordInput}),
					success: function(response){
						switch(response.loginCheckState){
							case "EMAIL_NOT_FOUND":
								$("#emailAlarmText").removeClass("d-none");
								break;
							case "INVALID_PASSWORD":
								$("#passwordAlarmText").removeClass("d-none");
								break;
							case "SUCCESS":
								$("#loginContent").remove();
								$("#modalBox").after(createStartContent());
								$.ajax({
									url: "/moden-shop/manager/profile/session/check",
									type: "get",
									success: function(response){
										$("#managerName").text(response.name);
									},
									error:function(xhr){
										console.log("관리자 회원 프로필 정보 가져오기ajax 에러 : " + xhr.status);
										switch(xhr.status){
											case 401:
												settingAndShowAlarmModal("알람", "세션이 만료되었습니다. 다시 한번 로그인 부탁드립니다", null, null);
												$("#startContent").remove();
												$("#modalBox").after(createManagerPageLoginContent());
												loginEvent();
											break;
										}
									}
								});	
								menuEvent();
								break;
							}
						},
						error:function(xhr){
							console.log("관리자 회원 로그인ajax 에러 : " + xhr.status);
						}
					});
				});
			}
