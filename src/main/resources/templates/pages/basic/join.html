<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/basic}">
<head>
<title layout:fragment="title">회원가입</title>
</head>
<body>
	<section layout:fragment="contents">
		<div class="d-flex justify-content-center pt-3 pb-5">
			<div class="d-flex flex-column col-4">

				<!-- 이메일 -->
				<div class="input-group mb-3">
					<input id="emailInput" type="text" class="form-control"
						placeholder="이메일">
					<div class="input-group-append">
						<button class="btn btn-secondary" type="button"
							id="emailAuthCodeSendBtn">인증코드 발송</button>
					</div>
				</div>

				<div class="input-group mb-3">
					<input type="text" id="authCodeInput" class="form-control"
						placeholder="이메일 인증 코드">
					<div class="input-group-append">
						<button class="btn btn-secondary" type="button"
							id="authCodeCheckBtn">인증</button>
					</div>
				</div>

				<div class="form-group">
					<input id="passwordInput" type="password" class="form-control"
						placeholder="비밀번호">
				</div>
				<div class="form-group">
					<input id="passwordCheckInput" type="password" class="form-control"
						placeholder="비밀번호 확인">
				</div>

				<div class="form-group">
					<input id="nameInput" type="text" class="form-control"
						placeholder="이름">
				</div>
				<div class="form-group">
					<input id="nickNameInput" type="text" class="form-control"
						placeholder="닉네임">
				</div>
				<div class="form-group">
					<input id="phoneNumberInput" type="text" class="form-control"
						placeholder="핸드폰 번호">
				</div>
				<div class="form-group">
					<label>주소</label> <input class="form-control" type="text"
						id="postCode" placeholder="우편번호"> <input
						class="form-control" type="text" id="address" placeholder="주소">
					<input class="form-control" type="text" id="detailAddress"
						placeholder="상세주소"> <input class="form-control"
						type="text" id="extraAddress" placeholder="참고항목(건물명 등)">
					<div class="d-flex justify-content-end">
						<button id="daumFindAddressBtn" type="button"
							class="btn btn-secondary">우편번호 찾기</button>
					</div>
				</div>
				<div>
					<button id="joinBtn" type="submit" class="btn btn-secondary w-100">회원가입</button>
				</div>
			</div>
		</div>
	</section>

	<th:block layout:fragment="script">
		<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
		<script>
			// 회원가입 버튼 활성화 변수
			let joinBtnState = false;
	
			// 인증번호 발송한 이메일
			let authCodeSendSuccessEmail = null;
	
			// 이메일 인증 버튼 활성화 변수
			let authCodeCheckBtnState = false;
	
	
			$("#emailAuthCodeSendBtn").on("click",function() {
				// 이메일 형식 정규식
				let emailPattern = /^[0-9a-zA-Z]([-_.]?[0-9a-zA-Z])*@[0-9a-zA-Z]([-_.]?[0-9a-zA-Z])*\.[a-zA-Z]{2,3}$/i;
				// emailInput 값 가져오기
				let emailInput = $("#emailInput").val();
				// 유효성 검사
				if (emailInput == "") {
					alert("이메일을 입력해주세요");
					return;
				}
				if (!emailPattern.test(emailInput)) {
					alert("올바른 이메일 형식으로 입력해 주세요");
					$("#email").val("");
					return;
				}
				if (emailInput.length > 64) {
					alert("이메일은 64자 이하만 가능합니다");
					$("#email").val("");
					return;
				}
				// 요청				
				$.ajax({
					url : "/moden-shop/email/auth-code/send",
					type : "post",
					data : {"email" : emailInput},
					success : function(response) {
						if (response.success) {
							authCodeCheckBtnState = true;
							authCodeSendSuccessEmail = emailInput;
							alert("인증번호가 발송되었습니다");
						} else {
							alert("인증번호가 발송에 실패하였습니다");
						}
					},
					error : function() {
						console.log("이메일 발송 ajax 오류");
					}
				});
			});
	
			$("#authCodeCheckBtn").on("click", function() {
				if (authCodeCheckBtnState) {
					// authCodeInput 값 가져오기
					let authCodeInput = $("#authCodeInput").val();
					// 유효성 검사
					if (authCodeInput == "") {
						alert("인증코드를 입력해주세요");
						return;
					}
					// 요청				
					$.ajax({
						url : "/moden-shop/email/auth-code/check",
						type : "post",
						data : {"authCode" : authCodeInput},
						success : function(response) {
							if (response.same) {
								joinBtnState = true;
								alert("인증번호가 일치합니다");
							} else {
								alert("인증번호가 틀립니다..");
							}
						},
						error : function() {
							console.log("인증코드 확인 ajax 오류");
						}
					});
				} else {
					alert("이메일 인증번호 발송 부터부탁드립니다");
				}
	
			});
	
			// 주소찾기 버튼 이벤트 
			$("#daumFindAddressBtn").on("click", function() {
				daumAddressService();
			});
			$("#joinBtn").on("click", function() {
				if (joinBtnState) {
					// 값 가져오기
					let emailInput = $("#emailInput").val();
					let passwordInput = $("#passwordInput").val();
					let passwordChekcInput = $("#passwordCheckInput").val();
					let nameInput = $("#nameInput").val();
					let nickNameInput = $("#nickNameInput").val();
					let phoneNumberInput = $("#phoneNumberInput").val()
					let postCode = $("#postCode").val();
					let address = $("#address").val();
					let detailAddress = $("#detailAddress").val(); // 필수 입력
					let extraAddress = $("#extraAddress").val(); // null가능
					// 유효성 검사
					if (authCodeSendSuccessEmail != emailInput) {
						authCodeCheckBtnState = false;
						joinBtnState = false;
						alert("이메일 인증을 다시해주세요");
						return;
					}
					if (passwordInput == "") {
						alert("비밀번호를 입력해주세요");
						return;
					}
	
					if (passwordInput.length < 6) {
						alert("비밀번호는 6자리 이상만 가능합니다");
						$("#password").val("");
						return;
					}
					if (passwordInput != passwordChekcInput) {
						alert("비밀번호와 비밀번호 확인이 일치하지 않습니다");
						$("#passwordInput").val("");
						$("#passwordChekcInput").val("");
						return;
					}
					let hasNumber = /[0-9]/.test(passwordInput);
					let hasLetter = /[a-zA-Z]/.test(passwordInput);
					let hasSpecial = /[!$@%]/.test(passwordInput);
					if (!(hasNumber && hasLetter && hasSpecial)) {
						alert("비밀번호는 6자 이상이어야 하고 숫자, 영문, 특수기호(!$@%)의 조합을 포함해야 합니다.");
						$("#passwordInput").val("");
						$("#passwordChekcInput").val("");
						return;
					}
					if (nameInput == "") {
						alert("이름을 입력해주세요");
						return;
					}
					if (nameInput.length > 32) {
						alert("이름은 32자 이하만 가능합니다");
						$("#name").val("");
						return;
					}
					if (nickNameInput == "") {
						alert("닉네임을 입력해주세요");
						return;
					}
					if (nickNameInput.length > 16) {
						alert("닉네임은 16자 이하만 가능합니다");
						$("#nickName").val("");
						return;
					}
					if (phoneNumberInput == "") {
						alert("핸드폰 번호를 입력해주세요");
						return;
					}
					let phonePattern = /^01[0-9]-?\d{3,4}-?\d{4}$/;;
					if (!(phonePattern.test(phoneNumberInput))) {
						alert("핸드폰번호 형식이 아닙니다");
						return;
					}
					if (postCode == "") {
						alert("우편번호를 입력해주세요");
						return;
					}
					if (address == "") {
						alert("주소를 입력해주세요");
						return;
					}
					if (detailAddress == "") {
						alert("상세주소를 입력해주세요");
						return;
					}
					if (extraAddress == "") {
						extraAddress = null;
					}
					// -추가
					if (!phoneNumberInput.includes('-')) {
						let formatted = phoneNumberInput.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
						phoneNumberInput = formatted;
					}
					$.ajax({
						url : "/moden-shop/general/Member/join",
						type : "post",
						contentType: "application/json",
						data: JSON.stringify({
							"email" : emailInput,
							"password" : passwordInput,
							"name" : nameInput,
							"nickName" : nickNameInput,
							"phoneNumber" : phoneNumberInput,
							"postCode" : postCode,
							"address" : address,
							"detailAddress" : detailAddress,
							"extraAddress" : extraAddress
						}),
						success : function(response) {
							if (response.joinSuccess) {
								location.href = "/moden-shop/login";
							} else {
								if (response.joinFailCause == "DUPLICATION") {
									switch (response.duplicationName) {
									case "EMAIL":
										alert("이미 가입된 이메일이 있습니다");
										break;
									case "NICK_NAME":
										alert("이미 사용중인 닉네임이 있습니다");
										break;
									case "PHONE_NUMBER":
										alert("이미 가입된 핸드폰번호가 있습니다");
										break;
									}
								} else if (response.joinFailCause == "JOIN_ERROR") {
									alert("회원가입 에러");
								}
							}
						},
						error : function() {
							console.log("일반회원가입 ajax 오류");
						}
					});
				} else {
					alert("이메일 인증을 완료 해주세요");
				}
			});
	
			
	
			function daumAddressService() {
				new daum.Postcode(
						{
							oncomplete : function(data) {
								// 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.
	
								// 각 주소의 노출 규칙에 따라 주소를 조합한다.
								// 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
								let addr = ''; // 주소 변수
								let extraAddr = ''; // 참고항목 변수
	
								//사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
								if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
									addr = data.roadAddress;
								} else { // 사용자가 지번 주소를 선택했을 경우(J)
									addr = data.jibunAddress;
								}
	
								// 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
								if (data.userSelectedType === 'R') {
									// 법정동명이 있을 경우 추가한다. (법정리는 제외)
									// 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
									if (data.bname !== ''
											&& /[동|로|가]$/g.test(data.bname)) {
										extraAddr += data.bname;
									}
									// 건물명이 있고, 공동주택일 경우 추가한다.
									if (data.buildingName !== ''
											&& data.apartment === 'Y') {
										extraAddr += (extraAddr !== '' ? ', '
												+ data.buildingName
												: data.buildingName);
									}
									// 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
									if (extraAddr !== '') {
										extraAddr = ' (' + extraAddr + ')';
									}
									// 조합된 참고항목을 해당 필드에 넣는다.
									extraAddr = $.trim(extraAddr); // 공백 제거
									$("#extraAddress").val(extraAddr);
	
								} else {
									$("#extraAddress").val("");
								}
	
								// 우편번호와 주소 정보를 해당 필드에 넣는다.
								$("#postCode").val(data.zonecode);
								$("#address").val(addr);
								// 커서를 상세주소 필드로 이동한다.
								$("#detailAddress").focus();
							}
						}).open();
			}
		</script>
	</th:block>
	
</body>
</html>
